# ============================================================
# 企智通 QZT - CI/CD 部署流程
# ============================================================
# 触发：push 到 main 分支
# 流程：构建 → 打包 → SSH 部署
# ============================================================

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 支持手动触发

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ============================================
  # Job 1: 构建产物
  # ============================================
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ============================================
      # 构建共享类型包
      # ============================================
      - name: Build Shared Types
        run: |
          cd packages/shared-types
          pnpm build

      # ============================================
      # 构建后端
      # ============================================
      - name: Build Backend
        run: |
          cd backend
          pnpm prisma generate
          pnpm build

      # ============================================
      # 构建前端
      # ============================================
      - name: Build Frontend
        run: |
          cd frontend
          pnpm build

      # ============================================
      # 构建网站
      # ============================================
      - name: Build Website
        run: |
          cd website
          pnpm build

      # ============================================
      # 打包产物（只上传必要文件）
      # ============================================
      - name: Create Deployment Package
        run: |
          mkdir -p artifact

          # 后端产物
          mkdir -p artifact/backend
          cp -r backend/dist artifact/backend/
          cp -r backend/prisma artifact/backend/
          cp backend/package.json artifact/backend/
          # 不复制 lockfile，让服务器根据 package.json 重新生成
          cp backend/.env.production.template artifact/backend/
          # 共享类型包（workspace 依赖）
          mkdir -p artifact/packages
          cp -r packages/shared-types/dist artifact/packages/shared-types/
          cp packages/shared-types/package.json artifact/packages/shared-types/

          # 前端产物
          mkdir -p artifact/frontend
          cp -r frontend/dist artifact/frontend/

          # 网站产物
          mkdir -p artifact/website
          cp -r website/.next artifact/website/
          cp -r website/public artifact/website/
          cp website/package.json artifact/website/
          # Next.js standalone 输出
          if [ -d website/.next/standalone ]; then
            cp -r website/.next/standalone/* artifact/website/
          fi

          # 配置文件
          mkdir -p artifact/config
          if [ -d config/pm2 ]; then
            cp -r config/pm2 artifact/config/
          fi
          if [ -d config/logrotate ]; then
            cp -r config/logrotate artifact/config/
          fi

          # 服务器部署脚本
          cp scripts/deploy/server-deploy.sh artifact/
          chmod +x artifact/server-deploy.sh

          # 健康检查脚本
          cat > artifact/health-check.sh << 'EOF'
          #!/bin/bash
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          YELLOW='\033[1;33m'
          NC='\033[0m'

          BACKEND_URL="${1:-http://localhost:7890}"
          FRONTEND_URL="${2:-http://localhost:80}"
          WEBSITE_URL="${3:-http://localhost:80}"

          echo -e "${YELLOW}健康检查中...${NC}"

          # 检查后端 API
          echo -n "后端 API: "
          if curl -sf "${BACKEND_URL}/api/health" > /dev/null; then
            echo -e "${GREEN}✓ 正常${NC}"
          else
            echo -e "${RED}✗ 失败${NC}"
            exit 1
          fi

          # 检查前端
          echo -n "前端: "
          if curl -sf "${FRONTEND_URL}/health" > /dev/null; then
            echo -e "${GREEN}✓ 正常${NC}"
          else
            echo -e "${RED}✗ 失败${NC}"
            exit 1
          fi

          # 检查网站
          echo -n "网站: "
          if curl -sf "${WEBSITE_URL}/health" > /dev/null; then
            echo -e "${GREEN}✓ 正常${NC}"
          else
            echo -e "${RED}✗ 失败${NC}"
            exit 1
          fi

          echo -e "${GREEN}所有服务健康检查通过${NC}"
          EOF
          chmod +x artifact/health-check.sh

          # 回滚脚本
          cat > artifact/rollback.sh << 'EOF'
          #!/bin/bash
          set -e

          RED='\033[0;31m'
          YELLOW='\033[1;33m'
          GREEN='\033[0;32m'
          NC='\033[0m'

          QZT_DIR="/opt/qzt"
          BACKUP_DIR="/opt/qzt-backup"

          echo -e "${YELLOW}开始回滚...${NC}"

          # 获取最新备份
          LATEST_BACKUP=$(ls -t "$BACKUP_DIR" 2>/dev/null | head -n 1)

          if [ -z "$LATEST_BACKUP" ]; then
            echo -e "${RED}未找到备份${NC}"
            exit 1
          fi

          echo -e "${YELLOW}回滚到: $LATEST_BACKUP${NC}"

          # 恢复后端
          if [ -d "$BACKUP_DIR/$LATEST_BACKUP/dist" ]; then
            rm -rf "$QZT_DIR/backend/dist"
            cp -r "$BACKUP_DIR/$LATEST_BACKUP/dist" "$QZT_DIR/backend/"
            echo -e "${GREEN}✓ 后端已恢复${NC}"
          fi

          # 恢复前端
          if [ -d "$BACKUP_DIR/$LATEST_BACKUP/frontend" ]; then
            rm -rf /var/www/qzt/frontend
            cp -r "$BACKUP_DIR/$LATEST_BACKUP/frontend" /var/www/qzt/
            echo -e "${GREEN}✓ 前端已恢复${NC}"
          fi

          # 重启服务（如果 PM2 配置存在）
          if [ -f "$QZT_DIR/backend/ecosystem.config.cjs" ]; then
            cd "$QZT_DIR/backend"
            pm2 reload ecosystem.config.cjs --update-env 2>/dev/null || pm2 start ecosystem.config.cjs
            pm2 save
            echo -e "${GREEN}✓ 服务已重启${NC}"
          else
            echo -e "${YELLOW}⚠ PM2 配置不存在，请手动重启服务${NC}"
          fi

          echo -e "${GREEN}回滚完成${NC}"
          EOF
          chmod +x artifact/rollback.sh

          # 版本信息
          echo "${{ github.sha }}" > artifact/VERSION
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifact/BUILD_TIME

      - name: Create Tarball
        run: |
          cd artifact
          tar -czf ../qzt-build.tar.gz .
          cd ..
          echo "Build size: $(du -h qzt-build.tar.gz | cut -f1)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qzt-build
          path: qzt-build.tar.gz
          retention-days: 7

  # ============================================
  # Job 2: 部署到服务器
  # ============================================
  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: qzt-build

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "qzt-build.tar.gz"
          target: "/opt/qzt-deploy/"
          strip_components: 0

      - name: Run Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: /opt/qzt
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            set +e
            cd /opt/qzt-deploy
            tar -xzf qzt-build.tar.gz
            bash server-deploy.sh
            DEPLOY_EXIT_CODE=$?
            set -e

            if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
              echo "部署失败，退出码: $DEPLOY_EXIT_CODE"
              exit $DEPLOY_EXIT_CODE
            fi

      # ============================================
      # 等待服务启动
      # ============================================
      - name: Wait for Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "等待服务启动..."
            sleep 15

            # 等待后端服务
            for i in {1..30}; do
              if curl -sf http://localhost:7890/api/health > /dev/null 2>&1; then
                echo "后端服务已就绪"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "后端服务启动超时"
                pm2 logs qzt-backend --lines 20 --nostream
                exit 1
              fi
              sleep 2
            done

            # 等待网站服务
            for i in {1..30}; do
              if curl -sf http://localhost:5180/health > /dev/null 2>&1; then
                echo "网站服务已就绪"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "网站服务启动超时"
                pm2 logs qzt-website --lines 20 --nostream
                exit 1
              fi
              sleep 2
            done

      # ============================================
      # 健康检查
      # ============================================
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            cd /opt/qzt-deploy
            bash health-check.sh "http://localhost:7890" "http://localhost" "http://localhost"

      # ============================================
      # 部署后验证
      # ============================================
      - name: Post-Deployment Verification
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "========================================="
            echo "部署验证报告"
            echo "========================================="
            echo ""
            echo "PM2 服务状态:"
            pm2 status
            echo ""
            echo "磁盘使用:"
            df -h | grep -E '(Filesystem|/opt|/var)'
            echo ""
            echo "内存使用:"
            free -h || vm_stat | head -10
            echo ""
            echo "最近日志:"
            pm2 logs --lines 10 --nostream
            echo ""
            echo "========================================="
            echo "验证完成"
            echo "========================================="

      # ============================================
      # 失败时回滚
      # ============================================
      - name: Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/qzt-deploy
            if [ -f rollback.sh ]; then
              echo "部署失败，开始回滚..."
              bash rollback.sh
            else
              echo "未找到回滚脚本"
            fi
