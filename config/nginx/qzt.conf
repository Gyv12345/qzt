# ============================================================
# 企智通 QZT - Nginx 配置
# ============================================================
# 功能：
#   1. 后端 API 反向代理 (/api → :7890)
#   2. 前端静态文件托管
#   3. 网站反向代理 (→ :5180)
#   4. Gzip 压缩、安全头、缓存策略
# ============================================================

# ============================================
# 后端配置 - API 反向代理
# ============================================
upstream qzt_backend {
    # 后端服务器集群
    server 127.0.0.1:7890 max_fails=3 fail_timeout=30s;

    # Keepalive 连接池
    keepalive 32;
}

# ============================================
# 前端配置 - 静态文件
# ============================================
upstream qzt_frontend {
    server 127.0.0.1:3456 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# ============================================
# 网站配置 - Next.js
# ============================================
upstream qzt_website {
    server 127.0.0.1:5180 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# ============================================
# 后台管理面板 (HTTP)
# ============================================
server {
    listen 80;
    listen [::]:80;

    # 域名配置（通过环境变量替换）
    server_name _;  # 默认匹配所有域名

    # ============================================
    # 访问日志
    # ============================================
    access_log /var/log/nginx/qzt-admin-access.log;
    error_log /var/log/nginx/qzt-admin-error.log;

    # ============================================
    # 安全头配置
    # ============================================
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # XSS 保护
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # 限制请求体大小
    # ============================================
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ============================================
    # API 反向代理
    # ============================================
    location /api/ {
        proxy_pass http://qzt_backend/api/;

        # 代理头设置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # WebSocket 支持
        proxy_set_header Connection "";

        # 健康检查（仅对 GET 请求）
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    # ============================================
    # 前端静态文件
    # ============================================
    location / {
        proxy_pass http://qzt_frontend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HMR (Hot Module Replacement) 支持
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # 健康检查端点
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # 静态资源缓存（如果使用独立托管）
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://qzt_frontend;

        # 缓存策略
        expires 7d;
        add_header Cache-Control "public, immutable";

        # 压缩
        gzip_static on;
    }

    # ============================================
    # 禁止访问隐藏文件
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================
# 公司网站 (HTTP)
# ============================================
server {
    listen 80;
    listen [::]:80;

    server_name _;

    access_log /var/log/nginx/qzt-website-access.log;
    error_log /var/log/nginx/qzt-website-error.log;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 请求体大小
    client_max_body_size 10M;

    # ============================================
    # 网站反向代理
    # ============================================
    location / {
        proxy_pass http://qzt_website;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Next.js ISR 缓存支持
        proxy_cache_bypass $http_upgrade;

        # 超时设置（SSR 可能需要更长时间）
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 16 4k;
    }

    # ============================================
    # Next.js 静态资源缓存
    # ============================================
    location /_next/static/ {
        proxy_pass http://qzt_website;

        # 长期缓存
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static/ {
        proxy_pass http://qzt_website;

        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================
    # 图片优化缓存
    # ============================================
    location /_next/image {
        proxy_pass http://qzt_website;

        # Next.js 图片优化器缓存
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

