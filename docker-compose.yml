# ============================================================
# 企智通 QZT - Docker Compose 配置
# ============================================================
# 用途：本地开发环境，快速启动所有服务
# 使用：docker-compose up -d
# ============================================================

version: '3.9'

services:
  # ============================================
  # MySQL 数据库
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: qzt-mysql-dev
    restart: unless-stopped
    ports:
      - "3307:3306"  # 避免与宿主机 MySQL 冲突
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: qzt_dev
      MYSQL_USER: qzt
      MYSQL_PASSWORD: qzt123
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qzt-network

  # ============================================
  # Redis 缓存
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: qzt-redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"  # 避免与宿主机 Redis 冲突
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - qzt-network

  # ============================================
  # 后端 API (NestJS)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: qzt-backend-dev
    restart: unless-stopped
    ports:
      - "7890:7890"
    environment:
      NODE_ENV: development
      PORT: 7890
      DATABASE_URL: mysql://qzt:qzt123@mysql:3306/qzt_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/prisma:/app/prisma
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7890/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qzt-network

  # ============================================
  # 前端 (React + Vite)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: qzt-frontend-dev
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      VITE_API_BASE_URL: http://localhost:7890/api
      NODE_ENV: development
      TZ: Asia/Shanghai
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - qzt-network

  # ============================================
  # 网站 (Next.js)
  # ============================================
  website:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    container_name: qzt-website-dev
    restart: unless-stopped
    ports:
      - "5180:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:7890/api
      TZ: Asia/Shanghai
    volumes:
      - ./website:/app
      - website_node_modules:/app/node_modules
      - /app/.next  # 避免覆盖 .next 目录
    depends_on:
      - backend
    networks:
      - qzt-network

  # ============================================
  # phpMyAdmin (可选，数据库管理)
  # ============================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: qzt-phpmyadmin-dev
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: qzt
      PMA_PASSWORD: qzt123
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - qzt-network
    profiles:
      - tools  # 使用 --profile tools 启动

  # ============================================
  # Redis Commander (可选，Redis 管理)
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: qzt-redis-commander-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis123
    depends_on:
      - redis
    networks:
      - qzt-network
    profiles:
      - tools

# ============================================
# 数据卷
# ============================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  website_node_modules:
    driver: local

# ============================================
# 网络
# ============================================
networks:
  qzt-network:
    driver: bridge
