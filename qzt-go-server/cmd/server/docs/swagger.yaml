host: localhost:9000
info:
  contact: {}
  description: |-
    基于 Go 的模块化单体后端(基础平台 + RBAC + 系统管理)。第一阶段地基。
    统一响应信封 {code,msg,data,timestamp};登录返回 JWT access/refresh 双令牌。
  title: 企业级业务管理平台 API
  version: "1.0"
paths:
  /api/attachments:
    get:
      description: 按 biz_type + resource_id 查询附件列表
      parameters:
      - description: 业务类型,如 CUSTOMER/CONTRACT
        in: query
        name: biz_type
        required: true
        type: string
      - description: 资源ID
        in: query
        name: resource_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 附件列表
      tags:
      - 附件
    post:
      consumes:
      - application/json
      description: 前端先上传文件(/api/upload 或 /api/upload/sts),再调本接口落库附件元数据
      parameters:
      - description: 附件信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CreateAttachmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 创建附件记录
      tags:
      - 附件
  /api/attachments/{id}:
    delete:
      description: 软删除附件记录。仅上传人或超级管理员可删除。注意:不删除存储层实际文件。
      parameters:
      - description: 附件ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 删除附件记录
      tags:
      - 附件
  /api/configs/public:
    get:
      description: 返回标记为 is_public 的配置项(key->value),供前端启动引导使用,免鉴权
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      summary: 公共配置
      tags:
      - 公共接口
  /api/dashboard/contract-trend:
    get:
      parameters:
      - description: 月数(默认6)
        in: query
        name: months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 合同签约趋势
      tags:
      - 仪表盘
  /api/dashboard/customer-distribution:
    get:
      description: 按维度(level/source/industry/status)分组统计客户
      parameters:
      - description: 维度(level/source/industry/status,默认level)
        in: query
        name: dimension
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 客户分布
      tags:
      - 仪表盘
  /api/dashboard/finance-summary:
    get:
      description: 按日期范围统计采购额/销售额/回款额
      parameters:
      - description: 开始日期(yyyy-MM-dd)
        in: query
        name: start_date
        type: string
      - description: 结束日期(yyyy-MM-dd)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 财务概览
      tags:
      - 仪表盘
  /api/dashboard/opportunity-funnel:
    get:
      description: 按阶段分组统计商机数量与金额
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 商机漏斗
      tags:
      - 仪表盘
  /api/dashboard/overview:
    get:
      description: 客户/商机/合同/回款/待办/库存预警 计数
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 首页核心指标
      tags:
      - 仪表盘
