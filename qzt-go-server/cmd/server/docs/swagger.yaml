host: localhost:9000
info:
  contact: {}
  description: |-
    基于 Go 的模块化单体后端(基础平台 + RBAC + 系统管理)。第一阶段地基。
    统一响应信封 {code,msg,data,timestamp};登录返回 JWT access/refresh 双令牌。
  title: 企业级业务管理平台 API
  version: "1.0"
paths:
  /api/ai/agents/{scenario}/run:
    post:
      description: scenario=insight(经营洞察)/approval-summary(审批助手)/daily-report(日报生成);采集真实业务数据构建提示词走统一LLM网关(feature=ai.agent记账);需
        sys_config ai.chat_enabled=1(默认关)
      parameters:
      - description: 场景:insight/approval-summary/daily-report
        in: path
        name: scenario
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/xresponse.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.AgentRunResponse'
              type: object
      security:
      - BearerAuth: []
      summary: AI 场景智能体运行
      tags:
      - AI场景智能体
  /api/ai/chat:
    post:
      description: 多轮对话:取最近20条消息+系统提示词走统一LLM网关(feature=ai.chat记账);需 sys_config ai.chat_enabled=1(默认关)
      parameters:
      - description: 对话消息列表(最近20条)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.AIChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/xresponse.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.AIChatResponse'
              type: object
      security:
      - BearerAuth: []
      summary: AI 助手对话补全
      tags:
      - AI助手
  /api/attachments:
    get:
      description: 按 biz_type + resource_id 查询附件列表
      parameters:
      - description: 业务类型,如 CUSTOMER/CONTRACT
        in: query
        name: biz_type
        required: true
        type: string
      - description: 资源ID
        in: query
        name: resource_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 附件列表
      tags:
      - 附件
    post:
      consumes:
      - application/json
      description: 前端先上传文件(/api/upload 或 /api/upload/sts),再调本接口落库附件元数据
      parameters:
      - description: 附件信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CreateAttachmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 创建附件记录
      tags:
      - 附件
  /api/attachments/{id}:
    delete:
      description: 软删除附件记录。仅上传人或超级管理员可删除。注意:不删除存储层实际文件。
      parameters:
      - description: 附件ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 删除附件记录
      tags:
      - 附件
  /api/calendar:
    get:
      description: 聚合各业务模块(日程/跟进/商机/回款/会议/出差/请假/工作日志/项目/任务/应收/绩效)带日期的待办,仅返回当前用户的
      parameters:
      - description: 开始日期(YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: 结束日期(YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: 来源(逗号分隔),省略=全部。可选:schedule,followup,opportunity,payment,meeting,trip,leave,worklog,project,task,receivable,performance
        in: query
        name: sources
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
