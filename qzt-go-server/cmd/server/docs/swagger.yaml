      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 回款趋势
      tags:
      - 仪表盘
  /api/file/dl:
    get:
      description: 解析 token 后流式返回私有目录文件。OSS 模式不会调用此接口。
      parameters:
      - description: 签名 token(由 /api/file/sign 返回 URL 中的 t 参数)
        in: query
        name: t
        required: true
        type: string
      - description: 文件 objectKey
        in: query
        name: k
        required: true
        type: string
      produces:
      - application/octet-stream
      responses: {}
      summary: 下载私有文件(local 模式)
      tags:
      - 公共接口
  /api/file/sign:
    get:
      description: 为私有桶/私有目录的文件签发短期(1h)下载 URL,无需 Authorization header
      parameters:
      - description: 文件 objectKey(上传时返回的 file_url)
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/xresponse.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.SignResult'
