        in: query
        name: folder
        type: string
      - description: 是否上传到私有桶(默认 false)
        in: query
        name: private
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
