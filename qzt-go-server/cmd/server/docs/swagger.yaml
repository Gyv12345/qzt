  /approval/actions/remove-sign:
    post:
      consumes:
      - application/json
      description: 撤销链上仍未轮到(PENDING)的加签任务;仅加签发起人可撤,撤销后若链已无人待处理则提前收尾
      parameters:
      - description: 减签请求
        in: body
        name: body
        required: true
