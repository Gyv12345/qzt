      description: 上传文件,支持公共桶(visibility=public)与私有桶(visibility=private)
      parameters:
      - description: 上传的文件
        in: formData
        name: file
        required: true
        type: file
      - description: 存储文件夹
        in: formData
        name: folder
        type: string
      - description: '可见性: public(默认)/private'
        enum:
        - public
        - private
        in: query
        name: visibility
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/xresponse.Response'
            - properties:
