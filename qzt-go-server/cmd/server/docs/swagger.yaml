      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 一键重新生成并发布静态站
      tags:
      - 静态站发布
  /deploy/status:
    get:
      description: 返回当前是否有任务在执行,以及各目标(当前仅 cms=官网+跨境双主题)最近一次重建的状态与日志尾(末 30 行)。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/xresponse.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.StatusResponse'
              type: object
      security:
      - BearerAuth: []
      summary: 静态站重建状态查询
      tags:
      - 静态站发布
