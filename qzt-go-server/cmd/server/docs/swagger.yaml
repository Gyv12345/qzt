      - application/json
      description: 为当前任务插入串行加签链(BEFORE 前加签:原任务挂起,链全批后恢复;AFTER 后加签:原任务先通过,链在其后,链尾批后流程续走);仅当前任务审批人本人可操作
      parameters:
      - description: 加签请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.AddSignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 审批加签
      tags:
      - 审批操作
  /approval/actions/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: 通过请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.ApproveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 审批通过
      tags:
      - 审批操作
  /approval/actions/push:
    post:
      consumes:
      - application/json
      description: 将业务资源提交审批(创建实例,按流程分配审批任务)
      parameters:
      - description: 提审请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.PushRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/xresponse.Response'
      security:
      - BearerAuth: []
      summary: 提交审批
      tags:
      - 审批操作
  /approval/actions/reject:
