application:
  enable_access_log: false  # 是否记录访问日志文件
  enable_pprof: true        # 是否注册 pprof 路由
  server:
    name: qzt-dev           # 服务名
    version: v1
    addr: 0.0.0.0           # 监听地址
    port: 9000              # 端口（8000 被本机 node 占用）
    read_timeout: 30s       # 读超时
    write_timeout: 30s      # 写超时
    max_header_mb: 4        # 最大请求头(MB)

log:
  output: console           # 输出方式：console / file / multi
  access_encoder: normal    # 访问日志编码：normal / json
  log_encoder: normal       # 业务日志编码：normal / json
  access_file_max_age_days: 7
  log_file_max_age_days: 7

mysql:
  enable_read_write_separation: false  # 是否启用读写分离
  # 敏感连接串通过 .env 注入：make run 自动加载 .env 并导出 MYSQL_DSN
  dsn: ${MYSQL_DSN:-root:<DATABASE_PASSWORD>@tcp(127.0.0.1:3306)/qztgo?charset=utf8mb4&parseTime=true&loc=Local&timeout=3s}
  mains_dsn: []                        # 主库 DSN（读写分离时）
  slaves_dsn: []                       # 从库 DSN（读写分离时）
  max_idle_conns: 4                    # 最大空闲连接
  max_open_conns: 20                   # 最大打开连接
  conn_max_idle_time: 5m               # 空闲连接最长存活(短于 RDS wait_timeout,避免用到被断的连接)
  conn_max_life_time: 30m              # 连接最长生命周期(定期重建,对抗中间网络设备超时)
  enable_sql_log: false                # 是否打印 SQL（调试时改 true）
  slow_sql_threshold_time: 3s          # 慢 SQL 阈值

redis:
  addr: ${REDIS_ADDR:-127.0.0.1:6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}
  dial_timeout: 2s
  read_timeout: 2s
  write_timeout: 2s
  idle_timeout: 60s
  min_idle_conns: 4
  pool_size: 10

jwt:
  issuer: qzt-server                                       # 签发者
  jwt_secret: ${JWT_SECRET:-Tphd67F7Mi%Aapi5iXsXX5ZRJxZF*6wK}  # 密钥（生产环境务必修改并改用环境变量注入）
  access_expiration_time: 2h                               # access token 有效期
  refresh_expiration_time: 168h                            # refresh token 有效期（7 天）

storage:
  driver: ${STORAGE_DRIVER:-local}  # 存储驱动：local（本地磁盘）| oss（阿里云 OSS）
  local_path: ./storage/public      # 公共存储根目录（driver=local，nginx 静态 serve）
  private_path: ./storage/private   # 私有存储根目录（driver=local，后端代理鉴权访问）
  resource_domain: http://localhost:9000  # 本地资源访问域名
  download_prefix: /prod-api/api/file/dl  # 私有文件代理下载 URL 前缀(vite 反代 /prod-api → 后端 /api)
  max_upload_mb: 20            # 单文件大小上限(MB)
  oss:                         # 阿里云 OSS 配置（driver=oss 时使用，敏感值通过 .env 注入）
    endpoint: ${OSS_ENDPOINT:-}
    access_key_id: ${OSS_ACCESS_KEY_ID:-}
    access_key_secret: ${OSS_ACCESS_KEY_SECRET:-}
    bucket_name: ${OSS_BUCKET_NAME:-}                # 公共桶(public-read)
    custom_domain: ${OSS_CUSTOM_DOMAIN:-}            # 公共桶 CDN/自定义域名（空则用默认域名）
    private_bucket_name: ${OSS_PRIVATE_BUCKET_NAME:-}        # 私有桶(private,留空则禁用私有附件)
    private_custom_domain: ${OSS_PRIVATE_CUSTOM_DOMAIN:-}    # 私有桶自定义域名（一般留空）

# 跨域白名单(可选):留空保持反射(本地 dev 前后端分离直连 5173/5174/3000 需要)
cors:
  allow_origins: []

# 统一 LLM 网关(internal/pkg/llm):OpenAI 兼容协议,所有 AI 功能唯一调用入口。
# api_key 只走 .env 注入(LLM_API_KEY);留空=未配置,llm.Chat 返回 ErrNotConfigured。
# base_url 常用值:DeepSeek https://api.deepseek.com ;通义兼容模式 https://dashscope.aliyuncs.com/compatible-mode/v1
llm:
  base_url: ${LLM_BASE_URL:-https://api.deepseek.com}
  api_key: ${LLM_API_KEY:-}
  model: ${LLM_MODEL:-deepseek-chat}
  timeout: 60s
  max_retries: 2
  rpm: 120                  # 进程级每分钟最大请求数(令牌桶),0 不限流
  cache_ttl: 0s             # 相同请求响应缓存 TTL,0 关闭
  # P17 知识库 RAG：向量嵌入独立供应商(embedding 常与 chat 不同家),key 走 .env;api_key 留空=未配置,RAG 走降级路径
  embedding:
    base_url: ${KB_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
    api_key: ${KB_EMBEDDING_API_KEY:-}
    model: ${KB_EMBEDDING_MODEL:-text-embedding-v3}
    timeout: 30s
    max_retries: 2

# AI 文生视频网关(internal/pkg/videogen):GEO 信源产线视频生产端,当前实现火山方舟即梦 Seedance。
# api_key 只走 .env 注入(VIDEOGEN_API_KEY);留空=未配置,产线视频步自动跳过。
# 开通入口:火山引擎方舟控制台开通 doubao-seedance 模型;计费按条(720p/5s 约 0.5 元)。
videogen:
  provider: ark
  base_url: ${VIDEOGEN_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
  api_key: ${VIDEOGEN_API_KEY:-}
  model: ${VIDEOGEN_MODEL:-doubao-seedance-1-0-lite-t2v-250428}
  resolution: 720p          # 480p/720p/1080p
  duration_seconds: 5       # Seedance 支持 5/10
  ratio: 16:9               # 抖音竖屏改 9:16

# GEO 信源产线开关(internal/module/geo)。
geo:
  auto_push: true             # 定时产稿后自动推送公众号草稿箱(群发仍在 mp 后台人工确认)
  topic_auto_approve: false   # AI 生成的选题是否免审批直接进入产稿队列

# 搜索引擎主动推送(internal/pkg/searchpush,cms 模块/官网 SEO)。
# site 既是推送 URL 拼接前缀也是域名白名单;token/key 留空即对应通道禁用。
seo:
  site: "https://devlovecode.com"
  baidu_token: "${GEO_BAIDU_TOKEN:-}"     # 百度搜索资源平台 API 推送 token,只进 .env
  indexnow_key: "${SEO_INDEXNOW_KEY:-}"   # IndexNow 密钥,须与站点 /<key>.txt 文件一致,只进 .env
  daily_quota: 10                          # 每日兜底任务推给百度的最大条数(与百度每日配额对齐)
