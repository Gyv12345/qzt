[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# 角色匹配策略 + 路径模式匹配(keyMatch2) + 方法相等；
# 超级管理员角色(super_admin)直接放行，绕过具体策略。
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && r.act == p.act || r.sub == "super_admin"
