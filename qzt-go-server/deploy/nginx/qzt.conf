# ─────────────────────────────────────────────────────────────
# QZT Go Server — Nginx 完整站点配置(后端 + admin + mobile + cms)
#
# 域名规划:
#   @.yourdomain.com    → 企业官网(CMS,Next.js SSR,proxy → 127.0.0.1:3000)
#   admin.yourdomain.com → 后台管理(React SPA 静态)
#   h5.yourdomain.com   → 移动端(React SPA 静态)
#   api.yourdomain.com  → Go 后端 API(可选,也可直接用 @.yourdomain.com/api)
#
# 部署:
#   sed -i 's/yourdomain.com/实际域名/g' deploy/nginx/qzt.conf
#   cp deploy/nginx/qzt.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────

# 后端 API 上游
upstream qzt_backend {
    server 127.0.0.1:9000;
    keepalive 32;
}

# Next.js CMS 上游(企业官网 SSR)
upstream qzt_cms {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ═══════════════════════════════════════════════════════════
# 后台管理 admin.yourdomain.com (React SPA 纯静态)
# ═══════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/nginx/ssl/yourdomain.com.crt;
    ssl_certificate_key /etc/nginx/ssl/yourdomain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/admin.access.log;
    error_log  /var/log/nginx/admin.error.log;

    root /opt/qzt-admin/dist;
    index index.html;

    # SPA fallback:前端路由不存在的路径都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存(Vite 构建产物带 hash,可长期缓存)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到后端(同源,前端 baseURL='/' 直接请求相对路径)
    location ~ ^/(api|system|crm|cms|approval|enterprise|hrm|psi|finance|mcp)(/|$) {
        proxy_pass http://qzt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        client_max_body_size 50m;
        proxy_read_timeout 60s;
    }
}

# ═══════════════════════════════════════════════════════════
# 移动端 h5.yourdomain.com (React SPA 纯静态)
# ═══════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name h5.yourdomain.com;

    ssl_certificate     /etc/nginx/ssl/yourdomain.com.crt;
    ssl_certificate_key /etc/nginx/ssl/yourdomain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/h5.access.log;
    error_log  /var/log/nginx/h5.error.log;

    root /opt/qzt-mobile/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到后端
    location ~ ^/(api|system|crm|cms|approval|enterprise|hrm|psi|finance|mcp)(/|$) {
        proxy_pass http://qzt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        client_max_body_size 50m;
        proxy_read_timeout 60s;
    }
}

# ═══════════════════════════════════════════════════════════
# 企业官网 yourdomain.com / www.yourdomain.com (Next.js SSR)
# ═══════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/nginx/ssl/yourdomain.com.crt;
    ssl_certificate_key /etc/nginx/ssl/yourdomain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/cms.access.log;
    error_log  /var/log/nginx/cms.error.log;

    client_max_body_size 50m;

    # Next.js SSR:全部反代到 Node 进程
    location / {
        proxy_pass http://qzt_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js 静态资源(带 hash,长期缓存)
    location /_next/static/ {
        proxy_pass http://qzt_cms;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ═══════════════════════════════════════════════════════════
# HTTP → HTTPS 跳转(所有子域名)
# ═══════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com *.yourdomain.com;

    # ACME 证书验证(http 模式时用,DNS 模式可删)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
