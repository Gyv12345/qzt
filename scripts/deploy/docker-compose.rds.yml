# ============================================================
# 企智通 QZT - Docker Compose 编排配置 (RDS 版本)
# ============================================================
# 说明：
# - 适用于使用阿里云 RDS MySQL 的场景
# - 不包含 MySQL 容器，使用外部数据库
# - 资源限制标记为 ${RESOURCE_*}，由部署脚本自动替换
# ============================================================
# 使用方法：
#   1. 复制 .env.rds.example 为 .env
#   2. 填写 RDS 连接信息
#   3. 运行: docker compose -f docker-compose.rds.yml up -d
# ============================================================

services:
  # ============================================
  # 后端服务 (NestJS API)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: qzt-backend
    restart: unless-stopped
    ports:
      - "7890:7890"
    environment:
      NODE_ENV: production
      PORT: 7890
      # RDS 数据库配置（从环境变量读取）
      DATABASE_PROVIDER: mysql
      DB_HOST: ${RDS_HOST}
      DB_PORT: ${RDS_PORT:-3306}
      DB_USERNAME: ${RDS_USERNAME}
      DB_PASSWORD: ${RDS_PASSWORD}
      DB_DATABASE: ${RDS_DATABASE:-qzt_db}
      # 连接池配置（适配 RDS）
      DATABASE_URL: "mysql://${RDS_USERNAME}:${RDS_PASSWORD}@${RDS_HOST}:${RDS_PORT:-3306}/${RDS_DATABASE:-qzt_db}?connection_limit=20&pool_timeout=30"
      # Redis 配置
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-qzt_redis_password_change_me}
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret}
      # 域名配置
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
      # OSS 配置（可选）
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
    networks:
      - qzt-network
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7890/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 资源限制（由部署脚本根据服务器配置自动调整）
    deploy:
      resources:
        limits:
          cpus: '${BACKEND_CPU_LIMIT:-1}'
          memory: ${BACKEND_MEM_LIMIT:-1g}
        reservations:
          cpus: '${BACKEND_CPU_RESERVE:-0.25}'
          memory: ${BACKEND_MEM_RESERVE:-256m}
    volumes:
      - backend-logs:/app/backend/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # 前端服务 (React + Nginx)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: qzt-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # API 地址（容器内访问）
      VITE_API_URL: http://backend:7890
    networks:
      - qzt-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${FRONTEND_CPU_LIMIT:-0.5}'
          memory: ${FRONTEND_MEM_LIMIT:-256m}
        reservations:
          cpus: '${FRONTEND_CPU_RESERVE:-0.1}'
          memory: ${FRONTEND_MEM_RESERVE:-64m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # 网站服务 (Next.js)
  # ============================================
  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    container_name: qzt-website
    restart: unless-stopped
    ports:
      - "5180:5180"
    environment:
      NODE_ENV: production
      PORT: 5180
      HOSTNAME: "0.0.0.0"
    networks:
      - qzt-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5180/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${WEBSITE_CPU_LIMIT:-0.5}'
          memory: ${WEBSITE_MEM_LIMIT:-512m}
        reservations:
          cpus: '${WEBSITE_CPU_RESERVE:-0.1}'
          memory: ${WEBSITE_MEM_RESERVE:-128m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Redis 服务
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: qzt-redis
    restart: unless-stopped
    command: >
      sh -c '
      redis-server
      --requirepass ${REDIS_PASSWORD:-qzt_redis_password_change_me}
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      '
    networks:
      - qzt-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT:-0.5}'
          memory: ${REDIS_MEM_LIMIT:-256m}
        reservations:
          cpus: '${REDIS_CPU_RESERVE:-0.1}'
          memory: ${REDIS_MEM_RESERVE:-64m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================
# 网络配置
# ============================================
networks:
  qzt-network:
    name: qzt-network
    driver: bridge

# ============================================
# 数据卷配置
# ============================================
volumes:
  backend-logs:
    name: qzt-backend-logs
  redis-data:
    name: qzt-redis-data
