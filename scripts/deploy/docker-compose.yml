# ============================================================
# 企智通 QZT - Docker Compose 编排配置
# ============================================================
# 说明：
# - 本配置用于部署模式（本地构建 + Docker 运行）
# - 前置步骤：在本地构建 frontend、backend、website
# - 部署时将构建产物复制到 /opt/qzt/app/ 对应目录
# ============================================================

services:
  # ============================================
  # 后端服务 (NestJS API)
  # ============================================
  backend:
    image: registry.cn-heyuan.aliyuncs.com/yt4j/node:22.22.0
    container_name: qzt-backend
    restart: unless-stopped
    working_dir: /app/backend
    ports:
      - "7890:7890"
    environment:
      NODE_ENV: production
      PORT: 7890
      # 数据库配置
      DATABASE_PROVIDER: mysql
      DB_HOST: ${RDS_HOST:-mysql}
      DB_PORT: ${RDS_PORT:-3306}
      DB_USERNAME: ${RDS_USERNAME:-qzt_user}
      DB_PASSWORD: ${RDS_PASSWORD:-${DB_PASSWORD:-qzt_password_change_me}}
      DB_DATABASE: ${RDS_DATABASE:-qzt_db}
      # Redis 配置
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-qzt_redis_password_change_me}
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret}
      # 域名配置
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
    networks:
      - qzt-network
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
    volumes:
      # 挂载本地构建的 backend
      - ./app/backend:/app/backend:ro
      - backend-logs:/app/backend/logs
    command: ["node", "dist/main"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7890/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '${BACKEND_CPU_LIMIT:-1}'
          memory: ${BACKEND_MEM_LIMIT:-1g}
        reservations:
          cpus: '${BACKEND_CPU_RESERVE:-0.25}'
          memory: ${BACKEND_MEM_RESERVE:-256m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # 前端服务 (React + Nginx)
  # ============================================
  frontend:
    image: nginx:latest
    container_name: qzt-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # SSL 证书路径
      SSL_CERT_PATH: ${SSL_CERT_PATH:-./ssl/cert.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-./ssl/key.pem}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-true}
    networks:
      - qzt-network
    depends_on:
      backend:
        condition: service_healthy
        required: false
    volumes:
      # 挂载本地构建的 frontend 静态文件
      - ./app/frontend:/usr/share/nginx/html:ro
      # SSL 证书挂载
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.http.conf:/etc/nginx/conf.d/nginx.http.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${FRONTEND_CPU_LIMIT:-0.5}'
          memory: ${FRONTEND_MEM_LIMIT:-256m}
        reservations:
          cpus: '${FRONTEND_CPU_RESERVE:-0.1}'
          memory: ${FRONTEND_MEM_RESERVE:-64m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # 网站服务 (Next.js)
  # ============================================
  website:
    image: registry.cn-heyuan.aliyuncs.com/yt4j/node:22.22.0
    container_name: qzt-website
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5180:5180"
    environment:
      NODE_ENV: production
      PORT: 5180
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - qzt-network
    volumes:
      # 挂载本地构建的 website (Next.js standalone 模式)
      - ./app/website/public:/app/public:ro
      - ./app/website/package.json:/app/package.json:ro
      - ./app/website/.next/standalone:/app/standalone:ro
      - ./app/website/.next/static:/app/.next/static:ro
    command: ["node", "standalone/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5180/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${WEBSITE_CPU_LIMIT:-0.5}'
          memory: ${WEBSITE_MEM_LIMIT:-512m}
        reservations:
          cpus: '${WEBSITE_CPU_RESERVE:-0.1}'
          memory: ${WEBSITE_MEM_RESERVE:-128m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Redis 服务
  # ============================================
  redis:
    image: redis:latest
    container_name: qzt-redis
    restart: unless-stopped
    command: >
      sh -c '
      redis-server
      --requirepass ${REDIS_PASSWORD:-qzt_redis_password_change_me}
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      '
    networks:
      - qzt-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT:-0.5}'
          memory: ${REDIS_MEM_LIMIT:-256m}
        reservations:
          cpus: '${REDIS_CPU_RESERVE:-0.1}'
          memory: ${REDIS_MEM_RESERVE:-64m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # MySQL 服务 (本地模式，可选启动)
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: qzt-mysql
    restart: unless-stopped
    profiles:
      - local-db    # 只有在 --profile local-db 时才启动
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qzt_root_password_change_me}
      MYSQL_DATABASE: qzt_db
      MYSQL_USER: qzt_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-qzt_password_change_me}
    networks:
      - qzt-network
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-qzt_root_password_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${MYSQL_CPU_LIMIT:-1}'
          memory: ${MYSQL_MEM_LIMIT:-1g}
        reservations:
          cpus: '${MYSQL_CPU_RESERVE:-0.25}'
          memory: ${MYSQL_MEM_RESERVE:-256m}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================
# 网络配置
# ============================================
networks:
  qzt-network:
    name: qzt-network
    driver: bridge

# ============================================
# 数据卷配置
# ============================================
volumes:
  backend-logs:
    name: qzt-backend-logs
  redis-data:
    name: qzt-redis-data
  mysql-data:
    name: qzt-mysql-data
